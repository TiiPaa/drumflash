[package]
name = "drum-pattern-vst"
version = "0.1.0"
edition = "2021"
authors = ["Flash Drum"]
description = "A 64-step drum sequencer VST3 plugin"
license = "GPL-3.0"

[[bin]]
name = "test_standalone"
path = "src/bin/test_standalone.rs"

[[bin]]
name = "drum-pattern-midi-drag-helper"
path = "src/bin/midi_drag_helper.rs"

[dependencies]
nih_plug = { path = "vendor/nih-plug" }
nih_plug_egui = { path = "vendor/nih-plug/nih_plug_egui" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_arrays = "0.1"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
hound = "3.5"

[lib]
crate-type = ["cdylib"]
name = "drum_pattern_vst"
path = "src/lib.rs"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
panic = "abort"
codegen-units = 1
