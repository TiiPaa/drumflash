[package]
name = "drum-pattern-vst"
version = "0.1.0"
edition = "2021"
authors = ["Drum Flash"]
description = "A 16-step drum sequencer VST3 plugin"
license = "GPL-3.0"

[[bin]]
name = "test_standalone"
path = "src/bin/test_standalone.rs"

[dependencies]
nih_plug = { path = "vendor/nih-plug" }
nih_plug_egui = { path = "vendor/nih-plug/nih_plug_egui" }

[lib]
crate-type = ["cdylib"]
name = "drum_pattern_vst"
path = "src/lib.rs"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
panic = "abort"
codegen-units = 1
