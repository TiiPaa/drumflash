<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flash Drum — Option A</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/fd-base.css">
<style>
  html,body{margin:0;background:var(--bg);}
  .app{width:1400px;height:880px;background:var(--bg);color:var(--ink);font-family:var(--sans);
    display:grid;grid-template-rows:auto 1fr;overflow:hidden;}

  /* ---- top bar ---- */
  .bar{display:flex;align-items:center;gap:16px;padding:10px 16px;border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,#16181d,#121419);}
  .brand{display:flex;align-items:baseline;gap:8px;}
  .brand b{font:700 15px/1 var(--sans);letter-spacing:.02em;color:#fff;}
  .brand span{font:500 10px/1 var(--mono);color:var(--dim);}
  .seg{display:flex;align-items:center;gap:8px;}
  .vbar{width:1px;height:24px;background:var(--line);}
  .play{width:30px;height:30px;border-radius:7px;border:1px solid var(--line2);background:var(--panel2);
    color:var(--blue);font-size:13px;cursor:pointer;display:grid;place-items:center;}
  .play.on{background:var(--blue);color:#fff;border-color:var(--blue);}
  .bpm{display:flex;align-items:baseline;gap:4px;}
  .bpm b{font:600 18px/1 var(--mono);color:var(--ink);} .bpm i{font:500 9px/1 var(--mono);color:var(--dim);font-style:normal;}
  .hsl{display:flex;align-items:center;gap:8px;min-width:0;}
  .hsl .ctl{width:184px;}
  .hsl .ctl__label{width:auto;min-width:42px;}
  .tgls{display:flex;gap:6px;}
  .tgl{display:flex;align-items:center;gap:8px;height:28px;padding:0 12px;border-radius:8px;
    border:1px solid var(--line2);background:var(--panel2);color:var(--ink2);
    font:500 11.5px/1 var(--sans);cursor:pointer;transition:.16s;}
  .tgl .led{width:7px;height:7px;border-radius:50%;background:var(--faint);transition:.16s;}
  .tgl:hover{border-color:var(--line2);color:var(--ink);}
  .tgl.on{color:var(--ink);border-color:var(--blue);background:rgba(59,158,255,.1);}
  .tgl.on .led{background:var(--blue);box-shadow:0 0 8px var(--blue);}
  .pats{display:flex;gap:4px;margin-left:auto;}
  .pat{width:30px;height:26px;border-radius:5px;border:1px solid var(--line2);background:var(--panel2);
    color:var(--ink2);font:600 10px/1 var(--mono);cursor:pointer;}
  .pat.on{background:var(--blue);color:#fff;border-color:var(--blue);}

  /* ---- body ---- */
  .body{display:grid;grid-template-columns:850px 1fr;gap:0;min-height:0;}
  .col-l{display:flex;flex-direction:column;padding:14px 16px;gap:12px;min-height:0;border-right:1px solid var(--line);}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;}
  .panel__h{display:flex;align-items:center;gap:10px;padding:9px 13px;border-bottom:1px solid var(--line);}
  .panel__h h3{margin:0;font:600 10px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ink2);}
  .panel__h .sub{font:500 10px/1 var(--mono);color:var(--dim);margin-left:auto;}
  .seqwrap{padding:12px 13px;}
  .gen{flex:1 1 auto;display:flex;flex-direction:column;min-height:0;}
  .gen__b{padding:13px;display:grid;grid-template-columns:1fr 1fr;gap:14px 26px;align-content:start;}
  .chips{display:flex;gap:6px;grid-column:1/-1;flex-wrap:wrap;}
  .chip{padding:6px 12px;border-radius:6px;border:1px solid var(--line2);background:var(--panel2);
    color:var(--ink2);font:500 11px/1 var(--sans);cursor:pointer;}
  .chip:hover{color:var(--ink);border-color:var(--blue);}
  .chip--accent{background:rgba(255,147,38,.12);border-color:var(--orange-d);color:var(--orange);}
  .genbtn{grid-column:1/-1;height:36px;border-radius:8px;border:0;cursor:pointer;
    background:linear-gradient(180deg,var(--blue),var(--blue-d));color:#fff;font:600 12px/1 var(--sans);letter-spacing:.08em;
    box-shadow:0 4px 14px rgba(59,158,255,.3);}

  /* ---- editor ---- */
  .col-r{display:flex;flex-direction:column;min-height:0;background:var(--panel);}
  .tabs{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:13px 14px;border-bottom:1px solid var(--line);}
  .tab{height:26px;border-radius:6px;border:1px solid var(--line2);background:var(--panel2);
    color:var(--ink2);font:600 10.5px/1 var(--mono);cursor:pointer;}
  .tab.on{background:var(--blue);color:#fff;border-color:var(--blue);}
  .ed{flex:1 1 auto;overflow:hidden;padding:6px 16px 14px;}
  .ed__title{display:flex;align-items:baseline;gap:8px;padding:10px 0 2px;}
  .ed__title b{font:700 14px/1 var(--sans);color:#fff;} .ed__title span{font:500 11px/1 var(--mono);color:var(--dim);}
  .editor{column-count:1;}
</style>
</head>
<body>
<div class="app">
  <div class="bar">
    <div class="brand"><b>FLASH DRUM</b><span>v0.2</span></div>
    <div class="vbar"></div>
    <button class="play" id="play">▶</button>
    <div class="bpm"><b>124</b><i>BPM</i></div>
    <div class="vbar"></div>
    <div class="hsl" id="hVol"></div>
    <div class="hsl" id="hSwing"></div>
    <div id="hSwMode"></div>
    <div class="vbar"></div>
    <div class="tgls">
      <button class="tgl on" data-chk><span class="led"></span>Choke</button>
      <button class="tgl on" data-chk><span class="led"></span>Auto-Edit</button>
    </div>
    <div class="pats" id="pats"></div>
  </div>

  <div class="body">
    <div class="col-l">
      <div class="panel">
        <div class="panel__h"><h3>Sequencer</h3><span class="sub">Pattern P1 · 16 steps · 4/4</span></div>
        <div class="seqwrap"><div id="seq"></div></div>
      </div>
      <div class="panel gen">
        <div class="panel__h"><h3>Generator</h3><span class="sub">Probabilistic</span></div>
        <div class="gen__b">
          <div class="chips">
            <button class="chip">Rock</button><button class="chip">Funk</button>
            <button class="chip">Disco</button><button class="chip">Clear</button>
            <button class="chip chip--accent">⟳ Random</button>
            <button class="chip">Export MIDI</button><button class="chip">Drag</button>
          </div>
          <div id="gType"></div><div id="gStyle"></div>
          <div id="gMix"></div><div id="gDens"></div>
          <div id="gVar"></div><div></div>
          <button class="genbtn">GENERATE</button>
        </div>
      </div>
    </div>

    <div class="col-r">
      <div class="tabs" id="tabs"></div>
      <div class="ed">
        <div class="ed__title"><b id="edName">Bass Drum</b><span id="edCat">kick engine</span></div>
        <div class="editor" id="editor"></div>
      </div>
    </div>
  </div>
</div>

<script src="assets/fd-data.js"></script>
<script src="assets/fd-core.js"></script>
<script>
(function(){
  const C = window.FDCore, FD = window.FD;
  // header sliders
  document.getElementById('hVol').append(C.slider({label:'Master',min:-60,max:6,step:.1,value:-1.94,unit:'dB',fmt:v=>v.toFixed(1)}));
  document.getElementById('hSwing').append(C.slider({label:'Swing',min:0,max:100,step:1,value:0,unit:'%',fmt:v=>Math.round(v)}));
  document.getElementById('hSwMode').append(C.select({label:'',options:['Swing 8th','Swing 16th','Shuffle','Off'],value:'Swing 16th'}));
  document.getElementById('gType').append(C.select({label:'Type',options:['Probabilistic','Euclidean','Markov','Random'],value:'Probabilistic'}));
  document.getElementById('gStyle').append(C.select({label:'Style',options:['Rock','Funk','Disco','Trap','House'],value:'Rock'}));
  document.getElementById('gMix').append(C.slider({label:'Mix',min:0,max:1,step:.01,value:0.5}));
  document.getElementById('gDens').append(C.slider({label:'Density',min:0,max:1,step:.01,value:0.7}));
  document.getElementById('gVar').append(C.slider({label:'Variation',min:0,max:1,step:.01,value:0.3}));

  // patterns
  const pats = document.getElementById('pats');
  ['P1','P2','P3','P4','P5','P6','P7','P8'].forEach((p,i)=>{
    const b=C.el('button','pat'+(i===0?' on':''),{textContent:p});
    b.onclick=()=>{pats.querySelectorAll('.pat').forEach(x=>x.classList.remove('on'));b.classList.add('on');};
    pats.append(b);
  });
  document.querySelectorAll('[data-chk]').forEach(b=>b.onclick=()=>b.classList.toggle('on'));

  // tabs
  const tabs=document.getElementById('tabs');
  let current='BD';
  function setInst(id){
    current=id;
    tabs.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.id===id));
    const inst=FD.instruments.find(i=>i.id===id);
    document.getElementById('edName').textContent=inst.name;
    document.getElementById('edCat').textContent=inst.cat+' engine';
    C.buildEditor(document.getElementById('editor'),id,{style:'slider'});
    seq.selectRow(id);
  }
  FD.instruments.forEach(inst=>{
    const t=C.el('button','tab',{textContent:inst.id});t.dataset.id=inst.id;
    t.onclick=()=>setInst(inst.id);tabs.append(t);
  });

  // sequencer
  const seq=C.buildSequencer(document.getElementById('seq'),{selected:'BD',onSelect:setInst});
  setInst('BD');

  // playhead
  const play=document.getElementById('play');let timer=null,col=0;
  play.onclick=()=>{
    if(timer){clearInterval(timer);timer=null;play.classList.remove('on');play.textContent='▶';seq.setPlayhead(-1);return;}
    play.classList.add('on');play.textContent='■';
    timer=setInterval(()=>{seq.setPlayhead(col);col=(col+1)%16;},125);
  };
})();
</script>
</body>
</html>
